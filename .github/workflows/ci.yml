name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly govulncheck rerun against the current main so a CVE landing
  # mid-week against an unchanged dependency tree still gets caught.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 15m -coverprofile=coverage.out ./...
      - name: tiered coverage gate
        shell: bash
        run: |
          # The v2.0 WS cutover changed the coverage model. The
          # resource and datasource layers can't be unit-covered
          # against the WS transport without rewriting fixtures to
          # use internal/wsclient/testserver.go. Until that rewrite
          # lands, the acc suite (TF_ACC=1 against live TrueNAS) is
          # the canonical coverage source for those layers. Tier 1
          # holds high; Tier 2 gets floors.
          #
          # Mirrors scripts/acc.sh stage 4, keep in sync.
          declare -A TIER1=(
            [github.com/PjSalty/terraform-provider-truenas/internal/types]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/validators]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/resourcevalidators]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/planhelpers]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/planmodifiers]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/flex]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/acctest]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/wsclient]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/sweep]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/fwresource]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/customtypes]=100
          )
          declare -A TIER2_FLOOR=(
            [github.com/PjSalty/terraform-provider-truenas/internal/resources]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/datasources]=100
            [github.com/PjSalty/terraform-provider-truenas/internal/provider]=100
          )

          declare -A PKG_COV
          while IFS= read -r row; do
            pkg=$(awk -F: '{print $1}' <<<"$row" | xargs dirname)
            stmts=$(awk '{print $2}' <<<"$row")
            covered=$(awk '{print $3}' <<<"$row")
            if [ -z "${PKG_COV[$pkg]:-}" ]; then PKG_COV[$pkg]="0 0"; fi
            s=$(awk '{print $1}' <<<"${PKG_COV[$pkg]}")
            c=$(awk '{print $2}' <<<"${PKG_COV[$pkg]}")
            s=$((s + stmts))
            if [ "$covered" -gt 0 ]; then c=$((c + stmts)); fi
            PKG_COV[$pkg]="$s $c"
          done < <(tail -n +2 coverage.out)

          fail=0
          for pkg in "${!PKG_COV[@]}"; do
            s=$(awk '{print $1}' <<<"${PKG_COV[$pkg]}")
            c=$(awk '{print $2}' <<<"${PKG_COV[$pkg]}")
            if [ "$s" -eq 0 ]; then continue; fi
            cov_int=$((c * 100 / s))
            if [ -n "${TIER1[$pkg]:-}" ]; then
              floor=${TIER1[$pkg]}
              if [ "$cov_int" -lt "$floor" ]; then
                echo "  TIER1 $pkg: ${cov_int}% < ${floor}% floor"
                fail=$((fail + 1))
              fi
            elif [ -n "${TIER2_FLOOR[$pkg]:-}" ]; then
              floor=${TIER2_FLOOR[$pkg]}
              if [ "$cov_int" -lt "$floor" ]; then
                echo "  TIER2 $pkg: ${cov_int}% < ${floor}% floor"
                fail=$((fail + 1))
              fi
            fi
          done

          TOTAL=$(go tool cover -func=coverage.out | awk 'END {gsub("%",""); print $NF}')
          echo "total coverage: ${TOTAL}%"

          if [ "$fail" -gt 0 ]; then
            echo "${fail} package(s) below their coverage floor, blocking merge"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -v ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `make docs`, not a second copy of the command. Two things were wrong
      # with `go install tfplugindocs@latest && tfplugindocs validate`:
      #
      # @latest resolved to a different tfplugindocs than the v0.24.0 go.mod
      # pins, so CI validated with one version while `make docs` used another,
      # and every run refetched the tool over the network. That is what failed
      # on 2026-08-22: a TLS handshake timeout pulling hc-install, reported as
      # a docs failure without a single page being validated.
      #
      # The bare `validate` also dropped --provider-name, which the Makefile
      # passes. Without it the tool infers the provider name from the checkout
      # directory, so the job only passed because the directory happens to be
      # named terraform-provider-truenas. In any other checkout path it fails
      # on datasources it cannot match. Calling the Makefile keeps one
      # invocation for both.
      - run: make docs

      # tfplugindocs generate DELETES docs/guides/ and repopulates it from
      # templates/guides/, so a fix applied only to the docs/ copy is
      # reverted the next time anyone regenerates. That already happened:
      # architecture.md was corrected off REST in docs/ while the template
      # kept drawing a REST client and an internal/client package that no
      # longer exists.
      #
      # `tfplugindocs validate` cannot see this. It checks Registry format,
      # not whether the two copies agree. This is a plain diff because the
      # guide templates carry no Go template directives, so the pairs are
      # byte-identical by construction.
      # The two coverage-floor arrays are marked "keep in sync" and were
      # not: scripts/acc.sh enforced a floor on internal/customtypes that
      # ci.yml never had, so CI would have passed on a drop that a local
      # run caught. A comment asking for two things to match is not a
      # control; this is.
      - name: coverage floors match between CI and acc.sh
        run: |
          ci=$(grep -oE '\[github[^]]*\]=[0-9]+' .github/workflows/ci.yml | sort)
          sh=$(grep -oE '\[github[^]]*\]=[0-9]+' scripts/acc.sh | sort)
          if [ "$ci" != "$sh" ]; then
            echo "::error::coverage floors differ between .github/workflows/ci.yml and scripts/acc.sh"
            diff <(printf '%s\n' "$ci") <(printf '%s\n' "$sh") || true
            exit 1
          fi

      - name: guides templates match docs
        run: |
          rc=0
          for f in templates/guides/*.md; do
            b="$(basename "$f")"
            if ! diff -u "$f" "docs/guides/$b"; then
              echo "::error file=$f::$f drifted from docs/guides/$b. tfplugindocs generate repopulates docs/guides/ from templates/, so this drift silently reverts the docs page. Change both."
              rc=1
            fi
          done
          exit $rc

  # Catches TrueNAS removing a JSON-RPC method the provider still calls.
  # Nothing else here can see that: the code compiles, the unit tests use
  # fakes, and no live TrueNAS is in CI, so a removal is only observable
  # against upstream's own API definitions. service.start/service.stop
  # went @private in 26.0 and this repo kept calling them until someone
  # noticed by hand.
  #
  # Rides the same weekly schedule as govulncheck for the same reason: a
  # removal lands upstream against an unchanged codebase here, so a
  # push-triggered run alone would never see it.
  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/api-drift.sh
