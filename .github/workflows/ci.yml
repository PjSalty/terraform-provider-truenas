name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly govulncheck rerun against the current main so a CVE landing
  # mid-week against an unchanged dependency tree still gets caught.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 15m -coverprofile=coverage.out ./...
      # The gate is scripts/coverage-gate.sh, not a copy of it. This job and
      # scripts/acc.sh each carried their own transcription of the floors, and
      # the Makefile claimed to enforce them without running anything, so a
      # change could read 100% locally and fail here.
      - name: tiered coverage gate
        run: ./scripts/coverage-gate.sh coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -v ./...

      # release.yml only fires on a tag push, so a broken .goreleaser.yml would
      # surface at the moment of release and not before. Validating it on every
      # push costs seconds and moves that discovery to the change that caused
      # it. Same goreleaser constraint the release job uses, so the two cannot
      # disagree about what the config means.
      - name: release config is valid
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: check

      # `check` validates the schema and stops there: it does not expand a
      # single template, so a name_template of "{{ .Broken }}" passes it and
      # fails at release time. A snapshot build does expand them, and builds
      # every target, which is the only way to know a tag would succeed
      # without cutting one.
      #
      # Weekly rather than per-push because it produces 7 archives, and syft
      # is installed so the SBOM step is exercised the way release.yml does
      # it. Nothing is published: --snapshot with --skip=publish,sign.
      - name: Install syft
        if: github.event_name == 'schedule'
        uses: anchore/sbom-action/download-syft@v0

      - name: a release would actually build
        if: github.event_name == 'schedule'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: release --snapshot --clean --skip=publish,sign

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `make docs`, not a second copy of the command. Two things were wrong
      # with `go install tfplugindocs@latest && tfplugindocs validate`:
      #
      # @latest resolved to a different tfplugindocs than the v0.24.0 go.mod
      # pins, so CI validated with one version while `make docs` used another,
      # and every run refetched the tool over the network. That is what failed
      # on 2026-08-22: a TLS handshake timeout pulling hc-install, reported as
      # a docs failure without a single page being validated.
      #
      # The bare `validate` also dropped --provider-name, which the Makefile
      # passes. Without it the tool infers the provider name from the checkout
      # directory, so the job only passed because the directory happens to be
      # named terraform-provider-truenas. In any other checkout path it fails
      # on datasources it cannot match. Calling the Makefile keeps one
      # invocation for both.
      - run: make docs

      # tfplugindocs generate DELETES docs/guides/ and repopulates it from
      # templates/guides/, so a fix applied only to the docs/ copy is
      # reverted the next time anyone regenerates. That already happened:
      # architecture.md was corrected off REST in docs/ while the template
      # kept drawing a REST client and an internal/client package that no
      # longer exists.
      #
      # `tfplugindocs validate` cannot see this. It checks Registry format,
      # not whether the two copies agree. This is a plain diff because the
      # guide templates carry no Go template directives, so the pairs are
      # byte-identical by construction.
      # The two coverage-floor arrays are marked "keep in sync" and were
      # not: scripts/acc.sh enforced a floor on internal/customtypes that
      # ci.yml never had, so CI would have passed on a drop that a local
      # run caught. A comment asking for two things to match is not a
      # control; this is.
      - name: guides templates match docs
        run: |
          rc=0
          for f in templates/guides/*.md; do
            b="$(basename "$f")"
            if ! diff -u "$f" "docs/guides/$b"; then
              echo "::error file=$f::$f drifted from docs/guides/$b. tfplugindocs generate repopulates docs/guides/ from templates/, so this drift silently reverts the docs page. Change both."
              rc=1
            fi
          done
          exit $rc

  # Catches TrueNAS removing a JSON-RPC method the provider still calls.
  # Nothing else here can see that: the code compiles, the unit tests use
  # fakes, and no live TrueNAS is in CI, so a removal is only observable
  # against upstream's own API definitions. service.start/service.stop
  # went @private in 26.0 and this repo kept calling them until someone
  # noticed by hand.
  #
  # Rides the same weekly schedule as govulncheck for the same reason: a
  # removal lands upstream against an unchanged codebase here, so a
  # push-triggered run alone would never see it.
  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/api-drift.sh
